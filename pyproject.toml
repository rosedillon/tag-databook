[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-databook"
version = "0.1.1"
description = "Read DfT TAG Data Book (WebTAG) values in Python: values of time, discount rates, carbon values and the GDP deflator."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dillon Rose", email = "dillonrose0@icloud.com" }]
keywords = ["tag", "webtag", "tag-data-book", "dft", "transport-appraisal", "cost-benefit-analysis", "value-of-time", "green-book", "transport", "uk", "economics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-openpyxl>=3.1"]

[project.scripts]
tag-databook = "tag_databook.cli:main"

[project.urls]
Homepage = "https://github.com/rosedillon/tag-databook"
Documentation = "https://github.com/rosedillon/tag-databook#readme"
Source = "https://github.com/rosedillon/tag-databook"
Issues = "https://github.com/rosedillon/tag-databook/issues"
Changelog = "https://github.com/rosedillon/tag-databook/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# PEP 8: code may run to 99 when agreed, but comments and docstrings
# still wrap at 72.
max-doc-length = 72

[tool.mypy]
strict = true
