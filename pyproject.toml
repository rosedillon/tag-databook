[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-databook"
version = "0.1.0"
description = "Read appraisal parameters out of the DfT TAG Data Book workbook."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dillon Rose", email = "dillonrose0@icloud.com" }]
keywords = ["transport", "appraisal", "webtag", "tag", "dft", "cost-benefit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-openpyxl>=3.1"]

[project.scripts]
tag-databook = "tag_databook.cli:main"

[project.urls]
Homepage = "https://github.com/rosedillon/tag-databook"
Issues = "https://github.com/rosedillon/tag-databook/issues"
"TAG Data Book" = "https://www.gov.uk/government/publications/tag-data-book"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# PEP 8: code may run to 99 when agreed, but comments and docstrings
# still wrap at 72.
max-doc-length = 72

[tool.mypy]
strict = true
